name: backup

# Weekly backup (plan J1.17, technique-v2 §12.4): export the production household (GET /api/export
# with the export secret, J1.15), encrypt it with age to a public key whose private half only the
# human holds, and write it into the private repository LeDevNovice/deux-places-backups, which
# keeps the 14 latest exports (scripts/backup.mjs). Nothing is ever written in plain text: the
# export goes from the response to age through a pipe, in memory.
#
# Monday 03:17 UTC: 04:17 in Paris in winter, 05:17 in summer, outside the evening window
# (19:00–01:00, §10.4) and after Sunday's programming ritual; off the hour, because GitHub delays
# and may drop scheduled runs first at the start of each hour. Scheduled runs use main's latest
# commit; a manual run ("Run workflow", or the REST API) runs the job on main only.
# In a public repository GitHub disables a scheduled workflow after 60 days without activity; it is
# re-enabled from the Actions tab or with `gh workflow enable backup.yml`.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds EXPORT_SECRET and BACKUP_DEPLOY_KEY (secrets) and BACKUP_AGE_RECIPIENT (a variable: a
    # public key); its deployment branch rule allows main only.
    environment: backup
    concurrency:
      group: backup
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      AGE_VERSION: 1.3.2
      # sha256 of age-v1.3.2-linux-amd64.tar.gz, whose Sigsum proof (published with the release,
      # age's SIGSUM.md) was checked with sigsum-verify v0.13.1 and age's two release keys.
      AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deux-places
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: deux-places/.nvmrc

      - name: Install age
        run: |
          archive="age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$archive"
          echo "$AGE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/age" --strip-components=1 age/age
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      # The deploy key (write access to that repository only) stays in this checkout's git
      # configuration for the push; the action's post-job step removes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LeDevNovice/deux-places-backups
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          path: backups

      - name: Export, encrypt and keep the 14 latest exports
        id: export
        run: node deux-places/scripts/backup.mjs backups
        env:
          SITE: https://deux-places.ledevnovice.workers.dev
          EXPORT_SECRET: ${{ secrets.EXPORT_SECRET }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}

      - name: Commit and push the backup repository
        run: |
          git -C backups config user.name "github-actions[bot]"
          git -C backups config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C backups add --all
          git -C backups commit --quiet --message "Add $FILE" --message "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git -C backups push --quiet origin HEAD:main
          git -C backups show --stat --format="Pushed %h: %s" HEAD
        env:
          FILE: ${{ steps.export.outputs.file }}
