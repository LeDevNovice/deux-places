name: ci

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, checked against the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # The backup's age (backup.yml): pnpm check's tests encrypt and decrypt with it.
      AGE_VERSION: 1.3.2
      # sha256 of age-v1.3.2-linux-amd64.tar.gz, whose Sigsum proof (published with the release,
      # age's SIGSUM.md) was checked with sigsum-verify v0.13.1 and age's two release keys.
      AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: |
          node -v
          package_manager="$(node -p "require('./package.json').packageManager")"
          npm install -g "$package_manager"
          pnpm -v
          echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Install age
        run: |
          archive="age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$archive"
          echo "$AGE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/age" --strip-components=1 age/age age/age-keygen
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - run: node scripts/agent/verify.mjs --ci

      - run: pnpm check

      # Durable Object, Worker and WebSocket tests inside workerd (plan J1.3); `pnpm check` runs only
      # the unit project. Fake bindings come from vitest.config.ts: no secret, no Cloudflare account.
      - name: Run the Workers integration tests
        run: pnpm test:workers
        env:
          WRANGLER_SEND_METRICS: "false"

      # No .dev.vars exists here: it would be copied into dist/ by the build.
      - name: Build the PWA and the Worker
        run: pnpm build
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Check the initial JavaScript budget (technique-v2 §8.3)
        run: pnpm size-budget

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the whole history for secrets
        run: gitleaks git --redact --no-banner --verbose .

  # Production (plan J1.18): the account's workers.dev subdomain until the address is chosen at
  # checkpoint A (ADR-017). Pushes to main only, after `check` passed; one deployment at a time.
  # The Worker's own secrets live in Cloudflare (technique-v2 §10.1), set once by a human with
  # `wrangler secret put`; this job only holds the deploy credentials, in the `production`
  # environment, whose branch rule allows main only. Nothing is rolled back automatically.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          npm install -g "$package_manager"
          echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # The same build as `check`, from the same commit; no .dev.vars exists here.
      - name: Build the PWA and the Worker
        run: pnpm build
        env:
          WRANGLER_SEND_METRICS: "false"

      # Right before deploying, so that the window and the head of main are read at that moment:
      # outside 19:00–01:00 Paris time (§10.4), and only the commit main points to now, inside the
      # concurrency group, so that a re-run or a late run never deploys older code. A skipped
      # deployment is caught up by re-running this job after 01:00, or by the next push.
      - name: Check the evening window and the head of main
        id: gate
        run: |
          MAIN_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          export MAIN_HEAD
          node scripts/deploy-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      # The Vite build writes the deploy configuration to dist/deux_places/wrangler.json (Worker,
      # assets in dist/client); wrangler.jsonc alone has no assets directory and is refused.
      - name: Deploy with Wrangler
        if: steps.gate.outputs.deploy == 'true'
        run: ./node_modules/.bin/wrangler deploy --config dist/deux_places/wrangler.json --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json

      - name: Smoke test GET /api/v1/health on the deployed site
        if: steps.gate.outputs.deploy == 'true'
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP/wrangler-output.json"
